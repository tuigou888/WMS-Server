services:
  wms-server:
    build:
      context: ./wms-server
      args:
        MAVEN_MIRROR_URL: ${MAVEN_MIRROR_URL:-https://maven.aliyun.com/repository/public}
    restart: unless-stopped
    ports: ["${WMS_API_BIND:-127.0.0.1:8088}:8088", "${WMS_MGMT_BIND:-127.0.0.1:9089}:9089"]
    volumes: ["wms-logs:/app/logs"]
    # 服务器宿主机自建 MySQL：容器内用 host.docker.internal 访问（Linux 必须显式映射 host-gateway）
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      SPRING_PROFILES_ACTIVE: prod
      WMS_LOG_DIR: /app/logs
      # 审计日志归档（A3②）：目录必须落在 wms-logs 卷内，否则容器重建即丢归档。
      # DELETE_ENABLED 默认 false（只归档不删）；打开前确认归档文件已进备份。
      AUDIT_ARCHIVE_DIR: /app/logs/archive
      AUDIT_ARCHIVE_AFTER_DAYS: ${AUDIT_ARCHIVE_AFTER_DAYS:-365}
      AUDIT_ARCHIVE_DELETE_ENABLED: ${AUDIT_ARCHIVE_DELETE_ENABLED:-false}
      DB_URL: ${DB_URL:?Set DB_URL in .env}
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_DRIVER: com.mysql.cj.jdbc.Driver
      WECHAT_MOCK: "false"
      WECHAT_PAY_MOCK: "false"
      WECHAT_APPID: ${WECHAT_APPID:?Set WECHAT_APPID in .env}
      WECHAT_SECRET: ${WECHAT_SECRET:?Set WECHAT_SECRET in .env}
      WECHAT_WAREHOUSE_APPID: ${WECHAT_WAREHOUSE_APPID:?Set WECHAT_WAREHOUSE_APPID in .env}
      WECHAT_WAREHOUSE_SECRET: ${WECHAT_WAREHOUSE_SECRET:?Set WECHAT_WAREHOUSE_SECRET in .env}
      WECHAT_PAY_MCH_ID: ${WECHAT_PAY_MCH_ID:?Set WECHAT_PAY_MCH_ID in .env}
      WECHAT_PAY_MCH_SERIAL: ${WECHAT_PAY_MCH_SERIAL:?Set WECHAT_PAY_MCH_SERIAL in .env}
      WECHAT_PAY_API_V3_KEY: ${WECHAT_PAY_API_V3_KEY:?Set WECHAT_PAY_API_V3_KEY in .env}
      WECHAT_PAY_KEY_PATH: /run/secrets/wechat_pay_private_key
      WECHAT_PAY_PUB_KEY_ID: ${WECHAT_PAY_PUB_KEY_ID:?Set WECHAT_PAY_PUB_KEY_ID in .env}
      WECHAT_PAY_PUB_KEY_PATH: /run/secrets/wechat_pay_public_key
      WECHAT_PAY_NOTIFY_URL: ${WECHAT_PAY_NOTIFY_URL:?Set WECHAT_PAY_NOTIFY_URL in .env}
      WECHAT_PAY_REFUND_NOTIFY_URL: ${WECHAT_PAY_REFUND_NOTIFY_URL:?Set WECHAT_PAY_REFUND_NOTIFY_URL in .env}
      WMS_BOOTSTRAP_ADMIN_USERNAME: ${WMS_BOOTSTRAP_ADMIN_USERNAME:-}
      WMS_BOOTSTRAP_ADMIN_PASSWORD: ${WMS_BOOTSTRAP_ADMIN_PASSWORD:-}
    secrets:
      - source: wechat_pay_private_key
        target: wechat_pay_private_key
      - source: wechat_pay_public_key
        target: wechat_pay_public_key
    # 就绪探针连真实数据库（DB 挂 → /health/ready 返回 503 → 容器判 unhealthy）；
    # wms-web 依赖此状态，避免 server 起来但库不可用时反代全 5xx。
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8088/api/v1/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
  wms-web:
    build:
      context: ./wms-web
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    restart: unless-stopped
    ports: ["${WMS_WEB_BIND:-127.0.0.1:3100}:80"]
    depends_on:
      wms-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
# 备份范围（宿主机职责，compose 不做快照）：
#  1) MySQL 数据 —— 本部署用宿主机自建 MySQL，走宿主备份方案（mysqldump/xtrabackup）；
#  2) wms-logs 卷 —— 含审计归档 CSV（AUDIT_ARCHIVE_DIR）；卷显式命名，便于备份脚本按名引用；
#  3) ./secrets 下的商户密钥 —— 建议纳入加密备份。
# 注意：打开 AUDIT_ARCHIVE_DELETE_ENABLED 前，必须确认归档文件已进上述备份。
volumes:
  wms-logs:
    name: wms-logs
secrets:
  wechat_pay_private_key:
    file: ${WECHAT_PAY_PRIVATE_KEY_FILE:?Set WECHAT_PAY_PRIVATE_KEY_FILE in .env}
  wechat_pay_public_key:
    file: ${WECHAT_PAY_PUBLIC_KEY_FILE:?Set WECHAT_PAY_PUBLIC_KEY_FILE in .env}
