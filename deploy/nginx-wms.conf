# WMS 公网入口反向代理 —— wms.951357.xyz（宝塔面板版，Ubuntu 22.04）
# ============================================================
# 宝塔操作顺序：
#   1. 宝塔 -> 网站 -> 添加站点：域名 wms.951357.xyz，纯静态，不勾 PHP/FTP/数据库
#      （站点根目录默认 /www/wwwroot/wms.951357.xyz，仅用于 Let's Encrypt 文件验证）
#   2. 站点设置 -> SSL -> Let's Encrypt -> 文件验证 -> 申请
#   3. 站点设置 -> 配置文件：把下方两个 server{} 整体替换面板生成的 conf，
#      证书路径即宝塔标准路径（面板申请后自动生成在 /www/server/panel/vhost/cert/）
#   4. 保存后宝塔会自动 reload nginx；「服务」页确认 nginx 正常
#   5. 云厂商安全组放行 80/443；3306/8088/3000/9089 一律不对公网开放
# 证书续期：宝塔对 Let's Encrypt 证书自动续期并 reload，无需 certbot。
# 端口约定（docker compose 只绑 127.0.0.1，由宝塔 Nginx 统一对外）：
#   8088 -> wms-server API（小程序与 Web 都走 /api/v1）
#   3000 -> wms-web 管理端
#   9089 -> actuator 管理端口，仅供内网采集，刻意不配置，不要对外暴露

server {
    listen 80;
    server_name wms.951357.xyz;
    # Let's Encrypt 文件验证（宝塔把验证文件放在站点根目录的 .well-known 下）
    location /.well-known/acme-challenge/ { root /www/wwwroot/wms.951357.xyz; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name wms.951357.xyz;

    ssl_certificate     /www/server/panel/vhost/cert/wms.951357.xyz/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/wms.951357.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 后端 API
    location /api/v1/ {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 20m;   # Excel 导入 / OCR 图片上传
    }

    # Web 管理端（wms-web 容器内 nginx 自带 SPA 路由兜底）
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
