# WMS 公网入口反向代理 —— wms.951357.xyz
# 部署位置：服务器宿主机 Nginx（/etc/nginx/conf.d/wms.conf），证书用 certbot 签发：
#   certbot --nginx -d wms.951357.xyz   或   certbot certonly --nginx -d wms.951357.xyz
# 端口约定（docker compose 默认只绑 127.0.0.1，由本机 Nginx 统一对外）：
#   8088 -> wms-server API      （小程序与 Web 都走 /api/v1）
#   3000 -> wms-web 管理端
#   9089 -> actuator 管理端口，仅供内网采集，这里刻意不配置，不要对外暴露

server {
    listen 80;
    server_name wms.951357.xyz;
    # certbot 续期会用 80 端口校验，其余请求全部跳 HTTPS
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name wms.951357.xyz;

    ssl_certificate     /etc/letsencrypt/live/wms.951357.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wms.951357.xyz/privkey.pem;

    # 后端 API
    location /api/v1/ {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 20m;   # Excel 导入 / OCR 图片上传
    }

    # Web 管理端（容器内 nginx 会自行兜底 SPA 路由）
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
