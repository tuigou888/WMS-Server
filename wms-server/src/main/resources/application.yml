spring:
  application:
    name: wms-server
  datasource:
    # Development defaults to an in-memory H2 database. Use DB_URL/DB_USERNAME/DB_PASSWORD/DB_DRIVER for MySQL.
    url: ${DB_URL:jdbc:h2:mem:wms;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
server:
  port: ${SERVER_PORT:8088}
  servlet:
    context-path: /api/v1
logging:
  level:
    com.wms: INFO
