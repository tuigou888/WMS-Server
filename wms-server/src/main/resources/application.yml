spring:
  application:
    name: wms-server
  jackson:
    time-zone: Asia/Shanghai
  datasource:
    # Development defaults to an in-memory H2 database. Use DB_URL/DB_USERNAME/DB_PASSWORD/DB_DRIVER for MySQL.
    url: ${DB_URL:jdbc:h2:mem:wms;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc.time_zone: Asia/Shanghai
  h2:
    console:
      enabled: true
      path: /h2-console
  servlet:
    multipart:
      # Spring Boot 默认 max-file-size=1MB：手机拍照上传 OCR（通常 3-10MB）必然被拒，Excel 导入大表也会超。
      # 放宽到 10MB；应用层各自再收紧（OCR 8MB、Excel 5000 行），超限由 GlobalExceptionHandler 返回 400。
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:10MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:12MB}
server:
  port: ${SERVER_PORT:8088}
  servlet:
    context-path: /api/v1
  # 生产在 TLS 终止的反向代理后面（宝塔 nginx -> wms-web -> 这里），不认 X-Forwarded-* 的话
  # 后端会把 https 请求当成 http，同源判定随之失败，浏览器同源 POST 也会被 CORS 拦成 403。
  # 应用只绑 127.0.0.1，能改这些头的只有本机代理，所以这里无条件信任。
  forward-headers-strategy: framework

# 独立管理端口：避开 /api/v1 上下文路径。注意它同样会经过 Spring Security 链（实测无 token 是 401），
# 放行由 SecurityConfig.managementPortChain 按 localPort 精确处理，业务端口不受影响。
# compose 默认只把它绑到 127.0.0.1，由内网的采集器抓取，不对公网开放。
management:
  server:
    port: ${MANAGEMENT_PORT:9089}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}

wechat:
  appid: ${WECHAT_APPID:}
  secret: ${WECHAT_SECRET:}
  # 作业端小程序（wms-miniapp）独立的 appid/secret，wx-login 传 app=warehouse 时启用
  warehouse-appid: ${WECHAT_WAREHOUSE_APPID:}
  warehouse-secret: ${WECHAT_WAREHOUSE_SECRET:}
  mock: ${WECHAT_MOCK:false}
  pay:
    # 无 Profile 的本地开发默认走 mock；prod Profile 会强制为 false，且安全检查会拒绝覆盖。
    mock: ${WECHAT_PAY_MOCK:true}
    # 商户号
    mch-id: ${WECHAT_PAY_MCH_ID:}
    # 商户API证书序列号
    mch-serial-no: ${WECHAT_PAY_MCH_SERIAL:}
    # APIv3密钥（32位，回调解密用）
    api-v3-key: ${WECHAT_PAY_API_V3_KEY:}
    # 商户私钥 apiclient_key.pem 路径
    private-key-path: ${WECHAT_PAY_KEY_PATH:}
    # 微信支付公钥ID（PUB_KEY_ID_xxx）
    wechat-pay-public-key-id: ${WECHAT_PAY_PUB_KEY_ID:}
    # 微信支付公钥 pem 路径
    wechat-pay-public-key-path: ${WECHAT_PAY_PUB_KEY_PATH:}
    # 支付成功回调地址，如 https://your-domain/api/v1/market/pay/notify
    notify-url: ${WECHAT_PAY_NOTIFY_URL:}
    # 退款结果回调地址，如 https://your-domain/api/v1/market/pay/refund-notify
    refund-notify-url: ${WECHAT_PAY_REFUND_NOTIFY_URL:}

ocr:
  mock: ${OCR_MOCK:true}

# 审计日志归档（A3②）：operation_logs 只由 AOP 追加、没有清理逻辑，超保留期的行每日导出成 CSV。
# 归档目录默认落在日志目录下（容器里即 wms-logs 卷内的 /app/logs/archive），随日志一起备份。
# delete-enabled 刻意默认 false：只归档不删。确认归档文件已进入备份后再显式打开删除。
audit:
  archive:
    enabled: ${AUDIT_ARCHIVE_ENABLED:true}
    after-days: ${AUDIT_ARCHIVE_AFTER_DAYS:365}
    cron: ${AUDIT_ARCHIVE_CRON:0 30 3 * * *}
    dir: ${AUDIT_ARCHIVE_DIR:logs/archive}
    batch-size: ${AUDIT_ARCHIVE_BATCH_SIZE:500}
    delete-enabled: ${AUDIT_ARCHIVE_DELETE_ENABLED:false}

# 幂等请求记录清理：IdempotencyAspect 只插入不删除，idempotent_requests 会随请求无限增长。
# retention-hours 必须大于客户端最长重试窗口（响应重放依赖记录存在）；删除幂等，多实例同跑无副作用。
idempotency:
  cleanup:
    enabled: ${IDEMPOTENCY_CLEANUP_ENABLED:true}
    retention-hours: ${IDEMPOTENCY_RETENTION_HOURS:48}
    cron: ${IDEMPOTENCY_CLEANUP_CRON:0 15 4 * * *}

# 登录相关临时表清理：auth_login_attempts / wechat_bind_tickets 都只有惰性删除路径，
# 未再被访问的过期行会一直积累；login-attempt-retention-hours 是限速计数的排查保留期（窗口本身 10 分钟）。
auth:
  cleanup:
    enabled: ${AUTH_CLEANUP_ENABLED:true}
    login-attempt-retention-hours: ${AUTH_LOGIN_ATTEMPT_RETENTION_HOURS:24}
    cron: ${AUTH_CLEANUP_CRON:0 30 4 * * *}

# 库龄报表（inventory-age）需整表重放库存流水，是最重的报表；结果按访问范围缓存，TTL 秒（0=关闭）。
report:
  inventory-age-cache-seconds: ${REPORT_INVENTORY_AGE_CACHE_SECONDS:300}

# 全局 IP 限流（L2）：固定窗口，注册于 Security 链之前，登录/支付回调等免鉴权路径同样受保护。
# IP 取 X-Forwarded-For 首段（反代后 remoteAddr 全站同桶会误伤）；测试 profile 关闭。
security:
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    max-requests: ${RATE_LIMIT_MAX_REQUESTS:300}
    window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}

logging:
  level:
    com.wms: INFO
