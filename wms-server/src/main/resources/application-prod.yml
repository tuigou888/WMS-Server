spring:
  datasource:
    # Production deliberately has no H2 fallback: every database setting must be supplied.
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: ${DB_DRIVER}
    hikari:
      pool-name: wms-hikari
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:10000}
      # 必须小于 MySQL 默认 wait_timeout(8h)，否则空闲连接会被服务端单方面断开，取到即用即报错
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1740000}
      leak-detection-threshold: ${DB_LEAK_DETECTION_MS:20000}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        # 方括号是必需的：不加会被 Spring 宽松绑定转成小写，Hibernate 就收不到这个键
        # （已实测：同样写法的 "[use_sql_comments]" 会让日志里的 SQL 带上 /* */ 注释）
        "[session.events.log.LOG_QUERIES_SLOWER_THAN_MS]": ${SLOW_SQL_THRESHOLD_MS:200}
  flyway:
    enabled: true
    # Existing deployments created by Hibernate have no schema-history table.
    # Treat their pre-Flyway schema as V1, then apply every later migration.
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true
  h2:
    console:
      enabled: false

logging:
  level:
    com.wms: ${LOG_LEVEL_APP:INFO}
    # Hibernate 6 用 INFO 打慢语句（"Slow query took N milliseconds"），设成 WARN 等于把它全吃掉
    org.hibernate.SQL_SLOW: ${LOG_LEVEL_SLOW_SQL:INFO}

wechat:
  # Docker Compose also pins these values. ProductionSafetyConfig rejects environment overrides.
  mock: false
  pay:
    mock: false

ocr:
  mock: false
