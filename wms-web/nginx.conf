# 本容器前面还有一层 TLS 终止的反向代理（宝塔 nginx），它会带 X-Forwarded-* 过来；
# 直接写 $scheme 会把 https 覆盖成 http，导致后端判定为跨域并拒绝同源请求（403 Invalid CORS request）。
# 这里保留上游传下来的值，仅在直连本容器（无 X-Forwarded-*）时才退回本地值。
map $http_x_forwarded_proto $wms_forward_proto { default $http_x_forwarded_proto; "" $scheme; }
map $http_x_forwarded_host  $wms_forward_host  { default $http_x_forwarded_host;  "" $host; }
map $http_x_forwarded_port  $wms_forward_port  { default $http_x_forwarded_port;  "" $server_port; }

server {
  listen 80;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 10m;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location /api/v1/ {
    proxy_pass http://wms-server:8088/api/v1/;
    proxy_http_version 1.1;
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $wms_forward_proto;
    proxy_set_header X-Forwarded-Host $wms_forward_host;
    proxy_set_header X-Forwarded-Port $wms_forward_port;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
